name: Publish release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, such as v2.4.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      REQUESTED_RELEASE_TAG: ${{ github.event.inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
      - name: Resolve the existing version tag
        run: |
          [xml]$project = Get-Content ./VRCTTS/VRCTTS.csproj -Raw
          $version = [string]($project.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1)
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw 'The project must declare a release version.' }
          $tag = if ($env:REQUESTED_RELEASE_TAG) { $env:REQUESTED_RELEASE_TAG } else { "v$version" }
          if ($tag -cne "v$version") { throw 'Release tag must exactly match the project version.' }
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
      - name: Check out the immutable release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: ga
      - name: Verify tag matches the project version
        run: |
          [xml]$project = Get-Content ./VRCTTS/VRCTTS.csproj -Raw
          $version = [string]($project.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1)
          if ($env:RELEASE_TAG -cne "v$version") { throw 'Release tag must exactly match the project version.' }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Build and run isolated checks
        run: ./scripts/test.ps1
      - name: Build installer and package this version
        run: ./package.ps1 -ExpectedVersion $env:RELEASE_VERSION
      - name: Check installer installation and removal
        run: ./scripts/test-installer.ps1 -InstallerPath "./artifacts/release/VRCTTS-$env:RELEASE_VERSION-Setup.exe"
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: VRCTTS-${{ env.RELEASE_VERSION }}-packages
          path: |
            artifacts/release/*-Setup.exe
            artifacts/release/*.zip
            artifacts/release/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
      - name: Create GitHub release after all checks pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assetNames = @("VRCTTS-$env:RELEASE_VERSION-Setup.exe", "VRCTTS-$env:RELEASE_VERSION-win-x64.zip", "VRCTTS-$env:RELEASE_VERSION-compact-win-x64.zip", "VRCTTS-$env:RELEASE_VERSION-Source.zip", 'SHA256SUMS.txt')
          $assets = @($assetNames | ForEach-Object { Join-Path ./artifacts/release $_ })
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) { throw "Missing release asset: $asset" }
          }
          $existingAssets = @(& gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name' 2>$null)
          if ($LASTEXITCODE -eq 0) {
            $missing = @($assets | ForEach-Object { Split-Path -Leaf $_ } | Where-Object { $_ -notin $existingAssets })
            if ($missing.Count -gt 0) { throw 'An incomplete release already exists. Review its assets manually; nothing was overwritten.' }
            Write-Host 'The release already contains all expected assets; nothing was changed.'
            exit 0
          }
          $arguments = @('release', 'create', $env:RELEASE_TAG, '--repo', $env:GITHUB_REPOSITORY, '--verify-tag', '--title', "VRCTTS $env:RELEASE_VERSION", '--notes-file', 'RELEASE_NOTES.md', '--generate-notes')
          if ($env:RELEASE_VERSION.Contains('-')) { $arguments += '--prerelease' }
          & gh @arguments @assets
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed. Existing release assets are never overwritten automatically.' }
